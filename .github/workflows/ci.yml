name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Runs the CLI directly: shopify/theme-check-action@v2 crashes with
      # "e.filter is not a function" when posting annotations.
      - name: Theme Check
        run: npx --yes @shopify/cli@5 theme check --fail-level error
